services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      API_PREFIX: ${API_PREFIX:-/api}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      BOT_DEFAULT_OWNER_USER_ID: ${BOT_DEFAULT_OWNER_USER_ID:-}
      BOT_DEFAULT_INBOUND_CHANNEL: ${BOT_DEFAULT_INBOUND_CHANNEL:-web}
      BOT_ENGINE_URL: ${BOT_ENGINE_URL:-http://autobot:8000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
      META_WEBHOOK_ENABLED: ${META_WEBHOOK_ENABLED:-true}
      META_WEBHOOK_DEBUG: ${META_WEBHOOK_DEBUG:-false}
      META_EMBEDDED_SIGNUP_CONFIG_ID: ${META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      META_BUSINESS_ID: ${META_BUSINESS_ID:-}
      META_SYSTEM_USER_ID: ${META_SYSTEM_USER_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_TIMEOUT_MS: ${META_TIMEOUT_MS:-8000}
      META_MEDIA_TIMEOUT_MS: ${META_MEDIA_TIMEOUT_MS:-60000}
      META_DEBUG_GRAPH_TOKEN: ${META_DEBUG_GRAPH_TOKEN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
    volumes:
      # Persist images/PDFs across redeploys (EasyPanel COMPOSE uses this file from Git).
      - autobot-uploads:/app/autobot
    depends_on:
      - autobot

  autobot:
    build:
      context: ./bot
      dockerfile: Dockerfile.autobot
    restart: unless-stopped
    environment:
      API_HOST: ${BOT_API_HOST:-0.0.0.0}
      API_PORT: ${BOT_API_PORT:-8000}
      PORT: ${BOT_PORT:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DIALECT: ${DB_DIALECT:-mysql}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:4000/api}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      VEHICLE_IMAGES_PUBLIC_BASE_URL: ${VEHICLE_IMAGES_PUBLIC_BASE_URL:-}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      BOT_CRM_OWNER_USER_ID: ${BOT_CRM_OWNER_USER_ID:-}
      BOT_DEFAULT_INBOUND_CHANNEL: ${BOT_DEFAULT_INBOUND_CHANNEL:-web}
      CORS_ORIGINS: ${BOT_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BOT_PORT:-8000}:8000"

volumes:
  autobot-uploads:
